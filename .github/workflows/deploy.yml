name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # REACT_APP_* duoc nhung vao bundle luc build => URL backend phai
      # truyen vao day, sua environment cua container luc chay khong co tac dung.
      - name: Build & Push Frontend Docker image
        run: |
          docker build \
            --build-arg REACT_APP_BACKEND_URL="${{ secrets.REACT_APP_BACKEND_URL }}" \
            -t coderlord/wetech_fe:latest .
          docker push coderlord/wetech_fe:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            cd ~/wetech-law-course

            docker pull coderlord/wetech_fe:latest

            if ! timeout 300s docker compose up -d --no-deps frontend; then
              docker compose ps -a
              docker compose logs frontend --tail=150
              exit 1
            fi

            docker image prune -f
